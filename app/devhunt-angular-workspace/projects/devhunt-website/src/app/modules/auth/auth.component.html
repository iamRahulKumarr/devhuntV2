<div class="container position-absolute top-50 start-50 translate-middle">
  <form [formGroup]="form" (submit)="formSubmit()">
    <h1>Login</h1>

    <mat-form-field appearance="outline">
      <mat-label>Email Address</mat-label>
      <input matInput type="email" name="email" id="email" placeholder="Enter your email" formControlName="email">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput type="password" name="password" id="password" placeholder="Enter your password" formControlName="password">
    </mat-form-field>

    <button mat-flat-button class="mat-btn mat-btn-lg" type="submit">Login</button>
  </form>
</div>
